server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Caching is set with "expires", not add_header: any add_header inside a
    # location would silently drop the security headers above for that location.

    # Hashed build assets never change, so they can be cached for a year.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths serve index.html, which must not be cached
    # so a new release is picked up immediately.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
