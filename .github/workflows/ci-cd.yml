# Commit -> checks -> image build + scan -> push to GHCR -> Git tag bump -> Argo CD sync.
#
# Pull requests run every check and build/scan the images but publish nothing.
# Pushes to main (or the project branch) also push images and update the
# deployed version in Git, behind the "kind-local" environment gate.
name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, devops-project]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bhav0207/requip

jobs:
  backend:
    name: backend (fmt, vet, test, vulns)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: Backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: unit tests (race detector, coverage)
        run: go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1
      - name: govulncheck (known vulnerabilities in reachable code)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    name: frontend (lint, typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  config:
    name: deploy config (helm lint, schema, misconfig, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: false }
      - name: helm lint
        run: |
          helm lint deploy/helm/requip -f deploy/helm/requip/values-kind.yaml
          helm lint deploy/argocd/apps
      - name: kubeconform (rendered manifests against Kubernetes + CRD schemas)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          helm template requip deploy/helm/requip -n requip -f deploy/helm/requip/values-kind.yaml > rendered.yaml
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml
      - name: trivy repo scan (secrets, IaC misconfig, dependency vulns)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig,vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  build:
    name: image ${{ matrix.component }}
    needs: [backend, frontend, config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing via GitHub OIDC
    strategy:
      matrix:
        component: [backend, frontend]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        name: compute immutable tag from the commit
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_PREFIX}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "dir=$([ '${{ matrix.component }}' = backend ] && echo Backend || echo Frontend)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.meta.outputs.dir }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
            VITE_APP_VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: trivy image scan (block on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.component }}.spdx.json
      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push (only the image that passed the scan)
        id: push
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.component }}: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'
      - name: sign image (keyless, identity = this workflow)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"

  deploy:
    name: release to kind (GitOps tag bump)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to make the
    # release a manual approval step.
    environment: kind-local
    permissions:
      contents: write   # commit the new tag to Git
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: set image tags in values-kind.yaml
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          yq -i ".backend.image.tag = \"$TAG\" | .frontend.image.tag = \"$TAG\"" deploy/helm/requip/values-kind.yaml
          git diff
      - name: commit and push (Argo CD picks this up)
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/requip/values-kind.yaml
          if git diff --cached --quiet; then echo "already at $TAG"; exit 0; fi
          git commit -m "deploy: requip ${TAG} to kind [skip ci]" -m "Built from ${GITHUB_SHA} in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Deployed tag \`${TAG}\` (commit ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
