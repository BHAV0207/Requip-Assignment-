# Trace storage. The API sends OTLP/gRPC spans to tempo:4317.
tempo:
  retention: 24h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
persistence:
  enabled: false
serviceMonitor:
  enabled: true
