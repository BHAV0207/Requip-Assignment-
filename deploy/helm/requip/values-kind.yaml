    # DEMO (bad release): make 50% of API requests fail on the new version.
    # The canary analysis should abort this rollout automatically.
    FAULT_ERROR_RATE: "0.5"
  image:
    tag: "eee7fda"
frontend:
  image:
    tag: "eee7fda"
loadgen:
  enabled: true
