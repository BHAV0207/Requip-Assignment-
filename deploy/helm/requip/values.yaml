# Defaults shared by every environment. Environment differences live in
# values-<env>.yaml so there is one chart and no drifting copies of manifests.

nameOverride: ""

backend:
  image:
    repository: ghcr.io/bhav0207/requip-backend
    tag: ""            # set by CI (git SHA); empty falls back to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Used only when autoscaling is disabled. With HPA on, the Rollout omits
  # replicas so Argo CD does not fight the autoscaler (drift).
  replicas: 3
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    # Memory limit protects the node; no CPU limit to avoid throttling latency.
    limits: { memory: 256Mi }
  env:
    LOG_LEVEL: info
    DB_MAX_OPEN_CONNS: "10"
    DB_MAX_IDLE_CONNS: "5"
    RUN_MIGRATIONS: "true"
    # Demo only: fraction of /api requests that fail. Keep 0 in normal use.
    FAULT_ERROR_RATE: "0"
  tracing:
    enabled: true
    endpoint: http://tempo.monitoring.svc.cluster.local:4317
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 2

  # Release strategy. true = Argo Rollouts canary with automated analysis;
  # false = plain Deployment with a rolling update.
  rollout:
    enabled: true
    steps:
      - setWeight: 33
      - pause: { duration: 60s }
      - setWeight: 66
      - pause: { duration: 60s }
    analysis:
      prometheusAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
      interval: 30s
      failureLimit: 1
      # Canary fails if more than 5% of its /api requests return 5xx ...
      maxErrorRatio: 0.05
      # ... or its p95 latency exceeds 500ms.
      maxP95LatencySeconds: 0.5

frontend:
  image:
    repository: ghcr.io/bhav0207/requip-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

mysql:
  image: mysql:8.4
  storage:
    size: 2Gi
    storageClassName: ""   # cluster default
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

database:
  name: user_management
  user: requip
  # Secret created outside Git (scripts/create-secrets.sh) with keys
  # mysql-root-password and mysql-password. Nothing secret lives in this repo.
  existingSecret: requip-db

ingress:
  enabled: true
  className: traefik
  host: requip.localtest.me

networkPolicy:
  enabled: true
  ingressControllerNamespace: traefik
  monitoringNamespace: monitoring

monitoring:
  serviceMonitor: true
  prometheusRule: true
  grafanaDashboard: true
  # Availability SLO for /api requests (non-5xx), used by burn-rate alerts.
  sloAvailability: 0.995
  latencyThresholdSeconds: 0.3

# Synthetic traffic so dashboards and canary analysis have data in a lab cluster.
loadgen:
  enabled: false
  image: curlimages/curl:8.11.1
  intervalSeconds: "0.5"
